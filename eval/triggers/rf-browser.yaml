# Trigger query set for rf-browser (format: eval/triggers/README.md).
# Tune descriptions on the train split only; never edit validation queries
# to make a description pass (rotate them only when the skill's intent changes).
skill: rf-browser
model: claude-haiku-4-5-20251001
runs: 3
threshold: 0.5
queries:
  # should trigger (train)
  - {id: br-t01, split: train, should_trigger: true, query: "Write a Robot Framework test that logs into http://localhost:8000 with Browser library and checks the dashboard heading"}
  - {id: br-t02, split: train, should_trigger: true, query: "my suite has Library    Browser and New Page times out on the login page, how do I wait for the network to settle?"}
  - {id: br-t03, split: train, should_trigger: true, query: "How do I click a button inside a shadow DOM in robot framework playwright?"}
  - {id: br-t04, split: train, should_trigger: true, query: "rfbrowser test: switch to the new tab that opens after clicking 'Export'"}
  - {id: br-t05, split: train, should_trigger: true, query: "Assert the text of .price equals 9.99 using Get Text in my .robot file"}
  - {id: br-t06, split: train, should_trigger: true, note: "indirect: pasted error", query: "Robot run fails with 'TimeoutError: locator.click: Timeout 10000ms exceeded' on 'text=Checkout' — how do I fix the selector in my suite?"}
  - {id: br-t07, split: train, should_trigger: true, note: "typos, user phrasing", query: "robot framwork browser lib - how do i wait untill the loading spinner is gone before clicking Save?"}
  # should trigger (validation)
  - {id: br-v01, split: validation, should_trigger: true, note: "edit existing file", query: "Add a file-download test to tests/web/checkout.robot (we use Browser)"}
  - {id: br-v02, split: validation, should_trigger: true, query: "Reuse the logged-in state across RF web tests with storage state instead of logging in every time"}
  - {id: br-v03, split: validation, should_trigger: true, query: "Fill the form inside the iframe #payment with Robot Framework Browser library"}
  - {id: br-v04, split: validation, should_trigger: true, note: "indirect: no library named", query: "Create a Robot Framework UI test for our new React signup page (no web test library chosen yet)"}
  # should NOT trigger (train): sibling skills + non-RF look-alikes
  - {id: br-n01, split: train, should_trigger: false, note: "sibling rf-selenium", query: "Our suite imports SeleniumLibrary; make Open Browser use headless Chrome on the Selenium Grid"}
  - {id: br-n02, split: train, should_trigger: false, note: "sibling rf-selenium", query: "Wait Until Element Is Visible keeps failing with StaleElementReferenceException in my Robot test"}
  - {id: br-n03, split: train, should_trigger: false, note: "sibling rf-setup", query: "rfbrowser init fails with 'node not found' — how do I install Browser library without Node?"}
  - {id: br-n04, split: train, should_trigger: false, note: "sibling rf-requests", query: "Write a Robot test that POSTs JSON to /api/orders with RequestsLibrary and checks the 201 status"}
  - {id: br-n05, split: train, should_trigger: false, note: "non-RF look-alike", query: "Write a pytest-playwright test that checks the login page title"}
  - {id: br-n06, split: train, should_trigger: false, note: "non-RF look-alike", query: "Convert this Cypress test to Playwright TypeScript"}
  # should NOT trigger (validation)
  - {id: br-n07, split: validation, should_trigger: false, note: "sibling rf-selenium", query: "Switch to the second window with SeleniumLibrary and close the first"}
  - {id: br-n08, split: validation, should_trigger: false, note: "sibling rf-requests", query: "Call the /login REST endpoint from a Robot Framework test and check the token"}
  - {id: br-n09, split: validation, should_trigger: false, note: "non-RF look-alike", query: "Scrape product prices with Playwright for Python and save them as CSV"}
  - {id: br-n10, split: validation, should_trigger: false, note: "sibling rf-appium", query: "Automate the login screen of our Android app (.apk on the emulator) with Robot Framework"}
  # retired holdout (tune-skill-descriptions task 7.1): its results were inspected in the
  # 2026-09-30 evidence, so it moved to train (add-sibling-cues-to-descriptions D3).
  - {id: br-h01, split: train, should_trigger: true, note: "retired holdout (2026-09-30 evidence)", query: "Record a Playwright trace in my Robot Framework Browser suite, but only when a test fails"}
  - {id: br-h02, split: train, should_trigger: true, note: "indirect: symptom only; retired holdout (2026-09-30 evidence)", query: "In our RF web tests the cookie consent overlay blocks every click (Library    Browser), how do I dismiss it once per context?"}
  - {id: br-h03, split: train, should_trigger: true, note: "retired holdout (2026-09-30 evidence)", query: "robot browser library: intercept the /api/prices call and return fake JSON so the page shows a sale price"}
  - {id: br-h04, split: train, should_trigger: true, note: "retired holdout (2026-09-30 evidence)", query: "Check with Browser library that the 'Submit' button stays disabled until all required fields are filled"}
  - {id: br-h05, split: train, should_trigger: true, note: "retired holdout (2026-09-30 evidence)", query: "Run our Robot Framework Browser tests in Firefox and WebKit too, not only Chromium"}
  - {id: br-h06, split: train, should_trigger: false, note: "sibling rf-selenium; retired holdout (2026-09-30 evidence)", query: "SeleniumLibrary Open Browser should use a Firefox profile with a custom download folder"}
  - {id: br-h07, split: train, should_trigger: false, note: "sibling rf-selenium; retired holdout (2026-09-30 evidence)", query: "Our old WebDriver-based robot suite: Mouse Over on the main menu doesn't open the submenu"}
  - {id: br-h08, split: train, should_trigger: false, note: "sibling rf-setup; retired holdout (2026-09-30 evidence)", query: "After upgrading robotframework-browser, robot says the Playwright browsers are missing; reinstall them in our uv environment"}
  - {id: br-h09, split: train, should_trigger: false, note: "non-RF look-alike; retired holdout (2026-09-30 evidence)", query: "Write a Puppeteer script that screenshots our landing page every hour"}
  - {id: br-h10, split: train, should_trigger: false, note: "non-RF look-alike; retired holdout (2026-09-30 evidence)", query: "Set up Playwright Test sharding across 4 GitHub Actions runners"}
