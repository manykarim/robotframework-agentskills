# Trigger query set for rf-platynui (format: eval/triggers/README.md).
# Tune descriptions on the train split only; never edit validation queries
# to make a description pass (rotate them only when the skill's intent changes).
skill: rf-platynui
model: claude-haiku-4-5-20251001
runs: 3
threshold: 0.5
queries:
  # should trigger (train)
  - {id: pu-t01, split: train, should_trigger: true, query: "Automate the Windows Calculator with Robot Framework and PlatynUI: 1 + 2 must be 3"}
  - {id: pu-t02, split: train, should_trigger: true, query: "My suite has Library    PlatynUI.BareMetal — how do I click the OK button in the 'Save As' dialog?"}
  - {id: pu-t03, split: train, should_trigger: true, note: "indirect: no library named", query: "Write a Robot Framework test for our WPF desktop application's login window"}
  - {id: pu-t04, split: train, should_trigger: true, query: "How do I build an XPath for a button in the desktop tree with the PlatynUI inspector?"}
  - {id: pu-t05, split: train, should_trigger: true, query: "Type text into Notepad and save it from a Robot Framework desktop test on Linux (AT-SPI2)"}
  - {id: pu-t06, split: train, should_trigger: true, note: "indirect: pasted error", query: "Robot desktop test: Query returns nothing for //control:Button[@Name='OK'] even though the dialog is open — why?"}
  - {id: pu-t07, split: train, should_trigger: true, note: "typos, user phrasing", query: "platynui robot test cant find the 'File' menu in notepad on windows 11, locator help pls"}
  # should trigger (validation)
  - {id: pu-v01, split: validation, should_trigger: true, note: "edit existing file", query: "In tests/desktop/settings.robot (PlatynUI) add a step that maximizes the main window before clicking"}
  - {id: pu-v02, split: validation, should_trigger: true, query: "Use platynui-cli to list the windows of our GTK app so I can write Robot locators"}
  - {id: pu-v03, split: validation, should_trigger: true, query: "Robot Framework test for a Qt desktop app: press Ctrl+S with the keyboard and check the title changes"}
  - {id: pu-v04, split: validation, should_trigger: true, query: "Read the text of the result field in the desktop calculator with PlatynUI and compare it"}
  # should NOT trigger (train): sibling skills + non-RF look-alikes
  - {id: pu-n01, split: train, should_trigger: false, note: "sibling rf-appium", query: "Automate our Android app login with AppiumLibrary"}
  - {id: pu-n02, split: train, should_trigger: false, note: "sibling rf-browser", query: "Write a Browser library test for our web admin console"}
  - {id: pu-n03, split: train, should_trigger: false, note: "sibling rf-setup", query: "Install the PlatynUI pre-release into our uv project — uv refuses the dev version"}
  - {id: pu-n04, split: train, should_trigger: false, note: "sibling rf-selenium", query: "Test our Electron app's web view with SeleniumLibrary and chromedriver"}
  - {id: pu-n05, split: train, should_trigger: false, note: "non-RF look-alike", query: "Automate Notepad with pywinauto in Python"}
  - {id: pu-n06, split: train, should_trigger: false, note: "non-RF look-alike", query: "WinAppDriver test in C# that clicks a WPF button"}
  # should NOT trigger (validation)
  - {id: pu-n07, split: validation, should_trigger: false, note: "sibling rf-appium", query: "Test the iOS version of our app on the simulator with Robot Framework"}
  - {id: pu-n08, split: validation, should_trigger: false, note: "sibling rf-results", query: "Summarise which desktop tests failed in results/output.xml"}
  - {id: pu-n09, split: validation, should_trigger: false, note: "non-RF look-alike", query: "Write an AutoIt script that fills a Windows installer dialog"}
  - {id: pu-n10, split: validation, should_trigger: false, note: "non-RF look-alike", query: "Use xdotool in bash to click a window on Linux"}
  # retired holdout (tune-skill-descriptions task 7.1): its results were inspected in the
  # 2026-09-30 evidence, so it moved to train (add-sibling-cues-to-descriptions D3).
  - {id: pu-h01, split: train, should_trigger: true, note: "retired holdout (2026-09-30 evidence)", query: "Robot Framework test that opens the Windows 'Print' dialog in our accounting app and selects a printer"}
  - {id: pu-h02, split: train, should_trigger: true, note: "retired holdout (2026-09-30 evidence)", query: "PlatynUI: how do I wait for the splash screen of our desktop app to disappear before logging in?"}
  - {id: pu-h03, split: train, should_trigger: true, note: "retired holdout (2026-09-30 evidence)", query: "Our KDE app on Linux: write an RF test that toggles a checkbox in the Preferences window"}
  - {id: pu-h04, split: train, should_trigger: true, note: "indirect: symptom only; retired holdout (2026-09-30 evidence)", query: "My desktop robot test clicks the wrong 'Cancel' because two dialogs have one; how do I scope the locator to the active window?"}
  - {id: pu-h05, split: train, should_trigger: true, note: "intent only; retired holdout (2026-09-30 evidence)", query: "Drive Windows File Explorer from Robot Framework to rename a file via the context menu"}
  - {id: pu-h06, split: train, should_trigger: false, note: "sibling rf-appium; retired holdout (2026-09-30 evidence)", query: "Write a Robot Framework test for the Android settings app that toggles airplane mode"}
  - {id: pu-h07, split: train, should_trigger: false, note: "sibling rf-setup; retired holdout (2026-09-30 evidence)", query: "platynui won't install on Python 3.11 in our venv, which versions does it need?"}
  - {id: pu-h08, split: train, should_trigger: false, note: "sibling rf-browser; retired holdout (2026-09-30 evidence)", query: "Test our web-based admin dashboard running in Chromium from Robot Framework"}
  - {id: pu-h09, split: train, should_trigger: false, note: "non-RF look-alike; retired holdout (2026-09-30 evidence)", query: "Write a PowerShell script with UIAutomation that closes all Excel windows"}
  - {id: pu-h10, split: train, should_trigger: false, note: "non-RF look-alike; retired holdout (2026-09-30 evidence)", query: "Use SikuliX image matching to click an icon on the desktop"}
