id: narrow-python-library-inventory-scope-01
skill: rf-python-library
tier: narrow
description: |
  Write an Inventory keyword library whose stock must survive across the tests
  of one suite. With the default TEST scope a new instance is created for every
  test and the count is lost, so the naive library fails the hidden grader
  suite (eval/graders/python-library/inventory.robot). Either SUITE or GLOBAL
  scope passes. Non-gating: an explicit scope and no leaked keywords.
prompt: |
  Create libraries/Inventory.py, a Robot Framework keyword library written in
  Python, with these keywords:
    - Add Item    <name>    <quantity>   (quantity is an integer)
    - Item Count Should Be    <name>    <expected>   (fails when the count differs)
    - Clear Inventory   (empties the stock)
  Our suites add items in one test case and check the totals in later test
  cases of the same suite, so the counts must carry over between the tests of
  a suite. Suites import it as `Library    Inventory` with libraries/ on the
  python-path. Make sure it works before you finish.
model: claude-haiku-4-5-20251001
max_turns: 14
timeout_seconds: 300
allowed_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Glob
  - Grep
  - Skill
grader_checks:
  - type: custom_python
    name: hidden_suite_state_survives_tests
    func_ref: rf_skill_eval.scoring.custom.python_library:hidden_suite
    suite: inventory.robot
    expected_tests: 5
    gating: true
  - type: file_contains
    name: explicit_suite_or_global_scope
    path: libraries/Inventory.py
    regex: 'scope\s*=\s*["''](SUITE|GLOBAL)|ROBOT_LIBRARY_SCOPE'
    gating: false
  - type: custom_python
    name: checker_reports_no_leaks
    func_ref: rf_skill_eval.scoring.custom.python_library:checker_findings_absent
    path: libraries/Inventory.py
    absent: [leaked_keyword, state_in_test_scope, no_keywords]
    gating: false
  - type: tool_call_count
    name: loaded_rf_python_library_skill
    tool_pattern: "(Skill|Read)"
    input_pattern: '(rf-python-library|/skills/rf-python-library/SKILL\.md)'
    min: 1
fixture: sut-pylib
primary_metric: custom_python
