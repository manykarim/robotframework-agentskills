# Pre-change skill descriptions (frontmatter `description`, verbatim) as they stood after
# align-skill-names-with-spec / harden-skill-script-execution / strengthen-skill-eval-harness and
# before sharpen-skill-descriptions rewrote them. Used for the deferred pre-change trigger baseline
# (tasks 2.1 / 4.2): restore these into a scratch copy of skills/*/SKILL.md, run
# `rf-skill-eval trigger --split train,validation` there, and store it as the 'before' result.
rf-appium: Guide AI agents in creating AppiumLibrary tests for iOS and Android native apps, hybrid apps, and mobile browsers. Load when asked about mobile testing, Appium, or mobile app automation.
rf-browser: Guide AI agents in creating Browser Library tests using Playwright-powered automation with auto-waiting, assertion engine, and modern web features. Use when asked to create web tests with Browser Library, handle locators, assertions, iframes, Shadow DOM, or multi-tab scenarios.
rf-libdoc: Finds Robot Framework keywords for a task and explains a keyword's arguments, types and defaults from libdoc of libraries, resource files, suites and spec files, returning stable JSON. Use when choosing which keyword to call, searching libdoc or several libraries at once for a use case, or checking a keyword's signature and arguments before writing it. If robotcode is installed, `robotcode libdoc` (rf-robotcode) is usually quicker.
rf-platynui: Guide AI agents in creating native desktop UI tests with PlatynUI (new_core) using the PlatynUI.BareMetal library — cross-platform desktop automation over Windows UIA and Linux AT-SPI2 with an XPath query model. Use when asked to automate desktop applications (windows, buttons, menus, text fields), locate native UI elements by XPath, or write Robot Framework tests with PlatynUI.
rf-requests: Guide AI agents in creating REST API tests using RequestsLibrary. Use when building HTTP client tests, JSON/XML API testing, session management, authentication, file uploads, and response validation.
rf-restinstance: Guide AI agents in creating REST API tests using RESTinstance library. Use when building API tests with JSON Schema validation, built-in assertions, response field validation, and OpenAPI spec integration.
rf-results: Parse Robot Framework output.xml results into JSON summaries, detailed suite/test breakdowns, tag stats, execution errors, failed test messages, keyword-level errors, and timing. Use when asked to read/merge output.xml, compute pass/fail counts, tag stats, error messages, elapsed time, slowest tests/keywords, or combine/merge multiple outputs via rebot.
rf-robotcode: Guide AI agents in using the robotcode CLI for Robot Framework projects — test discovery, keyword docs (libdoc), running with robot.toml profiles and wrappers, stepwise REPL exploration, debugging failing tests with robot-debug, result analysis (summary, failures, stats, run diffs) and static analysis (analyze code). Use when asked to find tests, look up keyword signatures, debug a failing test, inspect output.xml, check .robot files for errors, or run tests with robotcode.
rf-selenium: Generate Robot Framework tests using SeleniumLibrary for browser automation with Selenium WebDriver. Use when asked to create web UI tests, automate browsers, interact with forms, handle multiple windows/frames, or execute JavaScript.
rf-setup: Guide AI agents in installing Robot Framework, its test libraries and tooling into a project environment and verifying the setup — with uv (preferred), Python venv + pip, or Poetry. Covers choosing the tool an existing project already uses, Python version requirements, library post-install steps (Browser rfbrowser init/install, Appium server and drivers, PlatynUI pre-release), project layout, CI and troubleshooting. Use when asked to install or set up Robot Framework, create a new test project, add a test library, fix "module not found" / wrong interpreter problems, or prepare CI for Robot Framework.
