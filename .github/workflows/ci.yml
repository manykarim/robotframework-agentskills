name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # tests/installer/ imports rf_agentskills; install it from the
        # in-repo package so the test collector can resolve it. The
        # editable install also runs the hatchling build hook that
        # mirrors plugins/rf-agentskills/ into the package's _assets/
        # tree — that's what the runtime asset-loader reads.
        run: |
          # pytest-asyncio is required by `asyncio_mode = "auto"` in
          # pyproject; pytest 9+ treats the unknown config option as a
          # fatal error otherwise. robocop + find-unused let the
          # validation-hook tests run for real here instead of skipping.
          pip install robotframework pytest pytest-asyncio robotframework-robocop robotframework-find-unused
          pip install -e ./installer
        shell: bash
      - name: Install PlatynUI (optional — rf-platynui keyword-fidelity test)
        # PlatynUI new_core requires Python 3.12+; the fidelity test skips when
        # it's absent, so this install is fail-soft (no-op on the 3.10 matrix
        # leg or if the pre-release is unavailable). Pinned to the verified
        # pre-release; prebuilt wheel, no Rust.
        run: pip install "robotframework-PlatynUI==0.12.0.dev330" || echo "PlatynUI unavailable on this interpreter — rf-platynui fidelity test will skip"
        shell: bash
      - name: Install Browser Library (optional — libdoc output regression tests)
        # Lets the Browser-specific rf_libdoc tests (named-only args, payload
        # bounds) run for real; skip-if-absent otherwise. No `rfbrowser init`
        # needed — libdoc only introspects the Python library.
        run: pip install robotframework-browser || echo "Browser unavailable — those libdoc tests will skip"
        shell: bash
      - name: Run tests
        # tests/eval/ is the rf-skill-eval harness suite — an INTERNAL
        # workspace package (root pyproject; "Private :: Do Not Upload")
        # whose live-agent tests live under tests/eval/ and bring in
        # the full eval dep set (pydantic, typer, jinja2, sqlite,
        # parquet…). That suite is exercised end-to-end by the
        # skill-evaluation workflow against real Claude Code; locally
        # run with `uv sync --all-extras && uv run pytest tests/eval/`.
        # This CI job stays focused on the plugin's own Python scripts
        # plus the public rf-agentskills installer (installed above).
        run: python -m pytest tests/ --ignore=tests/eval -v --tb=short
        shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint root scripts
        run: ruff check skills/*/scripts/*.py --select E,F,W --ignore E501
      - name: Lint plugin scripts
        run: ruff check plugins/rf-agentskills/scripts/*.py --select E,F,W --ignore E501
      - name: Lint MCP server
        run: ruff check plugins/rf-agentskills/servers/*.py --select E,F,W --ignore E501

  validate-plugin:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest-asyncio satisfies `asyncio_mode = "auto"` in pyproject
      # (pytest 9+ errors on the unknown config option without it).
      - run: pip install pytest pytest-asyncio
      - name: Validate manifests and SKILL.md frontmatter
        run: python -m pytest tests/test_marketplace_validation.py -v

  validate-robot-syntax:
    name: Validate .robot examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install robotframework
      - name: Parse all .robot files
        run: |
          python3 -c "
          import os, sys
          from robot.api import get_model
          errors, count = [], 0
          for root, dirs, files in os.walk('skills'):
              for f in files:
                  if f.endswith('.robot'):
                      path = os.path.join(root, f)
                      count += 1
                      try:
                          get_model(path)
                      except Exception as e:
                          errors.append(f'{path}: {e}')
          if errors:
              for e in errors: print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'All {count} .robot files valid')
          "

  check-drift:
    name: Check distribution sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify root/plugin scripts in sync
        run: bash scripts/check-drift.sh

  build-vscode-extension:
    name: Build VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate VS Code skills
        run: bash scripts/sync-skills.sh
      - name: Install dependencies
        run: cd vscode-extension && npm ci
      - name: Compile TypeScript
        run: cd vscode-extension && npx tsc
      - name: Package VSIX
        run: |
          cd vscode-extension
          npx @vscode/vsce package --no-dependencies -o robotframework-agentskills.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/robotframework-agentskills.vsix

  build-claude-plugin:
    name: Build Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync skills to plugin
        run: bash scripts/sync-skills.sh
      - name: Validate plugin
        run: |
          python3 -c "
          import json, os, sys
          # Check plugin.json
          with open('plugins/rf-agentskills/.claude-plugin/plugin.json') as f:
              pj = json.load(f)
          print(f'Plugin: {pj[\"name\"]} v{pj.get(\"version\",\"?\")}')
          # Check all skills have SKILL.md
          skills = [d for d in os.listdir('plugins/rf-agentskills/skills') if os.path.isdir(f'plugins/rf-agentskills/skills/{d}')]
          for s in skills:
              assert os.path.exists(f'plugins/rf-agentskills/skills/{s}/SKILL.md'), f'Missing SKILL.md in {s}'
          print(f'Skills: {len(skills)} validated')
          # Check scripts
          scripts = [f for f in os.listdir('plugins/rf-agentskills/scripts') if f.endswith('.py')]
          print(f'Scripts: {len(scripts)} found')
          # Check agents
          agents = [f for f in os.listdir('plugins/rf-agentskills/agents') if f.endswith('.md')]
          print(f'Agents: {len(agents)} found')
          # Check MCP server
          import ast
          ast.parse(open('plugins/rf-agentskills/servers/rf-tools-server.py').read())
          print('MCP server: syntax valid')
          "
      - name: Package Claude plugin
        run: |
          cd plugins
          tar -czf ../rf-agentskills-claude-plugin.tar.gz rf-agentskills/
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-plugin
          path: rf-agentskills-claude-plugin.tar.gz

  build-portable-skills:
    name: Build portable skills packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package standalone skills (for any agent)
        run: |
          tar -czf robotframework-skills-standalone.tar.gz \
            --transform='s|^skills/||' \
            skills/
      - name: Package Codex skills
        run: |
          mkdir -p .codex/skills
          for d in skills/robotframework-*/; do
            name=$(basename "$d")
            ln -sf "../../$d" ".codex/skills/$name"
          done
          tar -chzf robotframework-skills-codex.tar.gz .codex/skills/
      - name: Package Copilot skills
        run: |
          mkdir -p .github/skills
          for d in skills/robotframework-*/; do
            name=$(basename "$d")
            ln -sf "../../$d" ".github/skills/$name"
          done
          tar -chzf robotframework-skills-copilot.tar.gz .github/skills/
      - name: Upload standalone skills
        uses: actions/upload-artifact@v4
        with:
          name: standalone-skills
          path: robotframework-skills-standalone.tar.gz
      - name: Upload Codex skills
        uses: actions/upload-artifact@v4
        with:
          name: codex-skills
          path: robotframework-skills-codex.tar.gz
      - name: Upload Copilot skills
        uses: actions/upload-artifact@v4
        with:
          name: copilot-skills
          path: robotframework-skills-copilot.tar.gz
